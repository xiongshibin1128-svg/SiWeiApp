<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命之书：深度思维训练</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --primary: #5a67d8; --bg: #f0f4f8; }
        body { background-color: var(--bg); font-family: sans-serif; padding-bottom: 50px; }
        .main-card { max-width: 850px; margin: 30px auto; background: #fff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .header-ui { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; text-align: center; position: relative; }
        .content-ui { padding: 40px; }
        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .scenario-text { background: #f8fafc; border-left: 6px solid var(--primary); padding: 30px; border-radius: 12px; line-height: 2; font-size: 1.1rem; white-space: pre-wrap; margin-bottom: 30px; }
        .btn-action { background: var(--primary); color: white; padding: 15px; border-radius: 10px; border: none; font-size: 1.1rem; width: 100%; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
        .cal-day { aspect-ratio: 1; border: 1px solid #eee; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: white; }
        .cal-day.has-data { background: #c3dafe; color: #434190; font-weight: bold; }
        .score-box { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 20px; background: white; }
        .score-row { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .score-reason { padding: 20px; font-size: 0.95rem; color: #555; background: #fffdf5; border-left: 4px solid #f6ad55; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="loading" class="loading-mask hidden">
    <div class="spinner-grow text-primary" style="width: 3rem; height: 3rem;"></div>
    <div class="mt-4 fs-5 fw-bold text-primary" id="loadingMsg">AI 正在深度思考中...</div>
</div>

<div class="main-card">
    <div class="header-ui">
        <div style="position:absolute; top:10px; right:10px; cursor:pointer; opacity:0.6;" onclick="resetKey()">重置 Key</div>
        <h1 class="display-6 fw-bold">📖 生命之书</h1>
        <p class="mb-0 opacity-75">深度思维训练</p>
    </div>

    <div class="content-ui">
        <div id="viewHome">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0">复盘日历</h4>
                <button onclick="checkKeyBeforeStart()" class="btn btn-primary px-4">开始今日训练</button>
            </div>
            <div id="calGrid" class="calendar-grid"></div>
        </div>

        <div id="viewScenario" class="hidden">
            <h4 class="mb-4 text-primary">今日生活事例</h4>
            <div id="scenarioBody" class="scenario-text"></div>
            <button onclick="goQuestions()" class="btn-action">开始追问</button>
        </div>

        <div id="viewQuestion" class="hidden">
            <h4 class="mb-3 text-primary">追问 <span id="qIdx">1</span>/3</h4>
            <div class="alert alert-light border mb-4 fs-5" id="qContent"></div>
            <textarea id="uAnswer" class="form-control mb-4" rows="6"></textarea>
            <button onclick="submitAnswer()" class="btn-action">提交回答</button>
        </div>

        <div id="viewResult" class="hidden">
            <h3 class="text-center mb-5 text-primary">评估报告</h3>
            <div id="scoresArea"></div>
            <div id="finalAdvice" class="scenario-text"></div>
            <button onclick="location.reload()" class="btn btn-outline-primary w-100 mt-4 py-3">完成保存</button>
        </div>
    </div>
</div>

<script>
    const DIMENSIONS = ["自我觉知", "价值判断", "情绪掌舵", "深度思考", "意义构建", "视角多元性", "知行合一"];
    let appData = { date: new Date().toLocaleDateString(), scenario: "", qna: [], scores: [], advice: "" };
    let step = 0;

    function getStoredKey() { return localStorage.getItem('user_openai_key'); }
    function resetKey() { localStorage.removeItem('user_openai_key'); location.reload(); }

    function checkKeyBeforeStart() {
        let key = getStoredKey();
        if (!key) {
            key = prompt("请输入您的 OpenAI API Key (sk-...):");
            if (key && key.startsWith("sk-")) {
                localStorage.setItem('user_openai_key', key);
                startTraining();
            }
        } else {
            startTraining();
        }
    }

    async function safeFetch(prompt) {
        const key = getStoredKey();
        const target = 'https://api.openai.com/v1/chat/completions';
        // 关键：换了一个更稳定的代理，并修复了 POST 请求逻辑
        const proxy = 'https://corsproxy.io/?' + encodeURIComponent(target);

        try {
            const response = await fetch(proxy, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{role: "system", content: "你是一位专业的人生成长导师。"}, {role: "user", content: prompt}]
                })
            });
            const json = await response.json();
            if (json.error) throw new Error(json.error.message);
            return json.choices[0].message.content;
        } catch (err) {
            alert("AI 连接失败: " + err.message);
            location.reload();
        }
    }

    function showL(show, msg = "") {
        const el = document.getElementById('loading');
        if(msg) document.getElementById('loadingMsg').textContent = msg;
        show ? el.classList.remove('hidden') : el.classList.add('hidden');
    }

    async function startTraining() {
        document.getElementById('viewHome').classList.add('hidden');
        document.getElementById('viewScenario').classList.remove('hidden');
        showL(true, "生成事例中...");
        appData.scenario = await safeFetch("请生成一个关于生活意义的事例，约500字。");
        document.getElementById('scenarioBody').textContent = appData.scenario;
        showL(false);
    }

    function goQuestions() {
        document.getElementById('viewScenario').classList.add('hidden');
        document.getElementById('viewQuestion').classList.remove('hidden');
        askNext();
    }

    async function askNext() {
        step++;
        if(step > 3) { showFinalReport(); return; }
        document.getElementById('qIdx').textContent = step;
        showL(true, "构思问题中...");
        const q = await safeFetch(`基于事例：${appData.scenario}，提出第${step}个深度问题。`);
        appData.qna.push({q: q, a: ""});
        document.getElementById('qContent').textContent = q;
        showL(false);
    }

    async function submitAnswer() {
        appData.qna[step-1].a = document.getElementById('uAnswer').value;
        await askNext();
    }

    async function showFinalReport() {
        document.getElementById('viewQuestion').classList.add('hidden');
        document.getElementById('viewResult').classList.remove('hidden');
        showL(true, "评估中...");
        const res = await safeFetch(`请对以下对话进行评估打分并给出建议。对话：${JSON.stringify(appData.qna)}`);
        document.getElementById('finalAdvice').textContent = res;
        showL(false);
    }

    // 初始化日历
    (function(){
        const grid = document.getElementById('calGrid');
        for(let i=0; i<28; i++) {
            const d = document.createElement('div');
            d.className = 'cal-day';
            d.textContent = i+1;
            grid.appendChild(d);
        }
    })();
</script>
</body>
</html>
