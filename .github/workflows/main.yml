name: Build APK (Compatibility Mode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Flet Build APK
        run: |
          # 🌟 核心修复命令 🌟
          # 1. --no-android-impeller: 关闭导致白屏的新渲染引擎，使用最稳的旧引擎
          # 2. --include-all-platforms: 同时打包 32位和64位架构，确保旧手机也能装
          yes | flet build apk --verbose --no-android-impeller --include-all-platforms

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
