name: Build APK (Stable Pro)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 🌟 核心：严格按照我们锁定的版本安装零件
        pip install -r requirements.txt

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Flet Build APK
      run: |
        # 🌟 增加 --no-cache 确保百分之百是全新的干净打包
        # 这样能彻底杜绝“代码改了但手机上没变”的灵异事件
        yes | flet build apk --verbose --no-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/apk/app-release.apk
