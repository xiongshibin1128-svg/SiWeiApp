<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命之书：深度思维训练</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --primary: #6B46C1; --bg: #F7FAFC; }
        body { background-color: var(--bg); font-family: 'PingFang SC', sans-serif; padding-bottom: 60px; }
        
        .app-container { max-width: 800px; margin: 20px auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; min-height: 85vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; position: relative; flex-shrink: 0; }
        .content { padding: 20px 30px; flex-grow: 1; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-size: 1.1rem; width: 100%; transition: 0.2s; }
        .btn-main:hover { opacity: 0.9; transform: scale(0.98); }
        
        .scenario-box { background: #F0FFF4; border-left: 5px solid #48BB78; padding: 20px; border-radius: 8px; line-height: 1.8; margin-bottom: 20px; white-space: pre-wrap; color: #2d3748; }
        
        .ref-box { background: #edf2f7; border: 1px solid #cbd5e0; padding: 15px; border-radius: 8px; font-size: 0.9rem; color: #4a5568; max-height: 180px; overflow-y: auto; margin-bottom: 25px; line-height: 1.6; white-space: pre-wrap; }
        .ref-label { font-size: 0.85rem; font-weight: bold; color: #718096; margin-bottom: 5px; display: block; }

        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 20px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #E2E8F0; cursor: pointer; transition: 0.2s; }
        .cal-day:hover { background-color: #f7fafc; }
        .cal-day.has-data { background: #E9D8FD; color: #553C9A; font-weight: bold; border-color: #9F7AEA; }
        
        .home-btn { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .home-btn:hover { background: rgba(255,255,255,0.4); }
        .settings-area { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="loading" class="loading-mask hidden">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <div class="mt-3 fs-5 fw-bold text-primary" id="loadingText">AI 正在思考...</div>
</div>

<div class="app-container">
    <div class="header">
        <button onclick="switchView('viewHome')" class="home-btn" title="返回首页"><i class="bi bi-house-door-fill"></i></button>
        <h2 class="fw-bold mb-1"><i class="bi bi-journal-bookmark-fill me-2"></i>生命之书</h2>
        <p class="opacity-75 mb-0 small">深度思维训练 (轻量版)</p>
        <button onclick="resetKey()" class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3" style="font-size: 0.7rem;">重置Key</button>
    </div>

    <div class="content">
        <div id="viewHome">
            <div class="settings-area">
                <label class="form-label fw-bold small text-muted"><i class="bi bi-sliders"></i> 设置今日训练强度：</label>
                <select id="wordCountSelect" class="form-select">
                    <option value="200">🌱 精简版 (约200字 - 快速复盘)</option>
                    <option value="500" selected>🌳 标准版 (约500字 - 深度思考)</option>
                    <option value="800">🌲 深度版 (约800字 - 哲学探索)</option>
                </select>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0 fw-bold">📅 复盘日历</h4>
                <button onclick="startDaily()" class="btn btn-primary rounded-pill px-4">开始今日训练</button>
            </div>
            <div id="calendar" class="cal-grid"></div>
        </div>

        <div id="viewScenario" class="hidden">
            <h4 class="mb-3 text-primary">今日生活事例</h4>
            <div id="textScenario" class="scenario-box"></div>
            <button onclick="nextStep('viewQuestion')" class="btn-main">开始深度追问</button>
        </div>

        <div id="viewQuestion" class="hidden">
            <span class="ref-label"><i class="bi bi-book"></i> 原文对照</span>
            <div id="refContent" class="ref-box"></div>

            <h4 class="mb-3 text-primary">深度追问 <span id="qCount">1</span>/3</h4>
            <div id="textQuestion" class="alert alert-light border shadow-sm fs-5 fw-bold" style="color: #2b6cb0;"></div>
            
            <textarea id="inputAnswer" class="form-control mb-3" rows="5" placeholder="不用长篇大论，写下你最直观的感受..."></textarea>
            <button onclick="submitAnswer()" class="btn-main">提交回答</button>
        </div>

        <div id="viewResult" class="hidden">
            <h3 class="text-center text-primary mb-4">思维评估报告</h3>
            <div id="scoreList" class="mb-4"></div>
            <h5 class="fw-bold"><i class="bi bi-lightbulb"></i> 提升建议</h5>
            <div id="textAdvice" class="scenario-box" style="border-color: #805AD5; background: #FAF5FF;"></div>
            <button onclick="location.reload()" class="btn btn-outline-primary w-100 mt-3">完成并保存</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 你的 Worker 地址
    const WORKER_URL = "https://purple-flower-d965.xiongshibin1128.workers.dev"; 
    // ==========================================

    const DIMENSIONS = ["自我觉知", "价值判断", "情绪掌舵", "深度思考", "意义构建", "视角多元性", "知行合一"];
    let data = { date: new Date().toLocaleDateString(), scenario: "", qna: [], scores: [], advice: "" };
    let step = 0;

    function getKey() { return localStorage.getItem('deepseek_key'); }
    function resetKey() { localStorage.removeItem('deepseek_key'); location.reload(); }
    
    function showLoading(show, text) {
        document.getElementById('loading').classList.toggle('hidden', !show);
        if(text) document.getElementById('loadingText').textContent = text;
    }

    function switchView(id) {
        ['viewHome', 'viewScenario', 'viewQuestion', 'viewResult'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    async function callAI(promptText) {
        let key = getKey();
        if(!key) {
            key = prompt("请输入你的 DeepSeek API Key (sk-开头):");
            if(!key) return null;
            localStorage.setItem('deepseek_key', key);
        }

        const baseUrl = WORKER_URL.endsWith('/') ? WORKER_URL.slice(0, -1) : WORKER_URL;
        const finalUrl = baseUrl + "/chat/completions";

        try {
            const resp = await fetch(finalUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role: "system", content: "你是一位温柔、有洞察力的朋友。"}, // 把角色改得更亲切
                        {role: "user", content: promptText} 
                    ],
                    stream: false
                })
            });
            const json = await resp.json();
            if(json.error) throw new Error(json.error.message);
            return json.choices[0].message.content;
        } catch (e) {
            alert("连接中断，请检查魔法或 Key。");
            return null;
        }
    }

    async function startDaily() {
        if(WORKER_URL.includes("在这里填入")) { alert("请先去代码里设置 WORKER_URL！"); return; }
        
        const wordLimit = document.getElementById('wordCountSelect').value;
        switchView('viewScenario');
        showLoading(true, `生成事例 (${wordLimit}字)...`);
        
        const p = `生成一个关于生活意义与哲学的真实感人事例，字数严格控制在 ${wordLimit} 字左右。内容要避开职场博弈，侧重个人成长与内省。`;
        
        const res = await callAI(p);
        if(res) {
            data.scenario = res;
            document.getElementById('textScenario').textContent = res;
            document.getElementById('refContent').textContent = res;
        } else { switchView('viewHome'); }
        showLoading(false);
    }

    function nextStep(view) { switchView(view); if(view === 'viewQuestion') askQuestion(); }

    async function askQuestion() {
        step++;
        if(step > 3) { finishTraining(); return; }
        document.getElementById('qCount').textContent = step;
        document.getElementById('inputAnswer').value = "";
        showLoading(true, `构思第 ${step} 个问题...`);
        
        // 🔴 重点修改：增加了极其严格的字数和格式限制
        const p = `事例：${data.scenario}
历史问答：${JSON.stringify(data.qna)}
任务：基于维度【${DIMENSIONS.join(',')}】，向我提出第 ${step} 个问题。

⚠️ 严格要求（必须遵守）：
1. 只能提 **一个** 简短的问题。
2. 问题字数必须控制在 **40个字以内**。
3. **禁止** 使用列点（1. 2. 3.）。
4. **禁止** 解释为什么提这个问题。
5. **禁止** 提供背景说明。
6. 语气要像好朋友聊天一样轻松，不要像考试。

请直接输出那个问题，不要有任何其他废话。`;

        const res = await callAI(p);
        if(res) {
            data.qna.push({q: res, a: ""});
            document.getElementById('textQuestion').textContent = res;
        }
        showLoading(false);
    }

    async function submitAnswer() {
        const ans = document.getElementById('inputAnswer').value;
        if(ans.length < 5) return alert("请稍微写一点...");
        data.qna[step-1].a = ans;
        askQuestion();
    }

    async function finishTraining() {
        switchView('viewResult');
        showLoading(true, "生成报告...");
        
        const p1 = `对话：${JSON.stringify(data.qna)}\n请对用户在以下维度的表现打分(1-10)：${DIMENSIONS.join(',')}。每个维度必须有扣分理由。严格返回JSON数组：[{"dim":"维度","score":8,"reason":"理由"}]`;
        const res1 = await callAI(p1);
        
        const p2 = `基于以上表现，给出200字以上的综合提升建议。语气要鼓励为主。`;
        const res2 = await callAI(p2);

        if(res1 && res2) {
            try {
                const jsonMatch = res1.match(/\[.*\]/s);
                if(jsonMatch) data.scores = JSON.parse(jsonMatch[0]);
                else throw new Error("格式错误");
                data.advice = res2;
                renderResult();
                localStorage.setItem('life_log_' + data.date, JSON.stringify(data));
            } catch(e) { 
                document.getElementById('scoreList').innerHTML = "AI 评分格式解析有误，请直接阅读下方建议。";
                data.advice = res2;
                document.getElementById('textAdvice').textContent = data.advice;
            }
        }
        showLoading(false);
    }

    function renderResult() {
        const list = document.getElementById('scoreList');
        list.innerHTML = data.scores.map(s => `
            <div class="score-item">
                <span class="fw-bold">${s.dim}</span>
                <span class="score-val text-${s.score<7?'danger':'success'}">${s.score}分</span>
                <span class="score-reason">${s.reason}</span>
            </div>
        `).join('');
        document.getElementById('textAdvice').textContent = data.advice;
    }

    const cal = document.getElementById('calendar');
    for(let i=0; i<28; i++) {
        const d = new Date(); d.setDate(d.getDate() - (27-i));
        const k = 'life_log_' + d.toLocaleDateString();
        const has = localStorage.getItem(k);
        cal.innerHTML += `<div class="cal-day ${has?'has-data':''}" onclick="if(${Boolean(has)}) alert('历史记录已保存')">${d.getDate()}</div>`;
    }
</script>
</body>
</html>
